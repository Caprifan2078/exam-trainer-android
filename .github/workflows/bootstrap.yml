name: Import Android sources
on:
  push:
    paths:
      - 'source-parts/part04.txt'
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source tree
        run: |
          cat source-parts/part*.txt | base64 -d > project.tar.xz
          tar -xJf project.tar.xz
          cp -a exam-trainer-android/. .
          rm -rf exam-trainer-android project.tar.xz source-parts
      - name: Commit project sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Import Android Studio project source' || true
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run maths tests
        run: node scripts/test-engine.cjs
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ExamTrainer-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
