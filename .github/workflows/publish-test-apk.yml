name: "Publish test APK for direct download"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-test-apk.yml"
      - "app/src/main/assets/**"
      - "app/build.gradle"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check exam generator and worksheet
        run: |
          node scripts/test-engine.cjs
          node scripts/test-upgrade.cjs
          node scripts/test-sheets.cjs
          node scripts/test-nmck-v09.cjs
          node scripts/test-nmck-template.cjs
          node scripts/test-formula-regressions.cjs
      - name: Verify v0.9.9 learning interface
        run: node scripts/test-learning-v095.cjs
      - name: Verify 0.9.6 finance and budget syllabus
        run: node scripts/test-syllabus-v096.cjs
      - name: Verify 0.9.9 financial stability and ROA/ROS/ROE formulas
        run: node scripts/test-finance-v097.cjs
      - name: Verify universal zoom 15-250 percent, pinch and 3 workbook modules
        run: node scripts/test-zoom-v098.cjs
      - name: Verify 0.9.9 mobile usability and data-safety regressions
        run: node scripts/test-mobile-v099.cjs
      - name: Build signed debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Publish permanent GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          RELEASE_APK="ExamTrainer_v0.9.9.apk"
          cp "$APK" "$RELEASE_APK"
          if gh release view "v0.9.9" >/dev/null 2>&1; then
            gh release upload "v0.9.9" "$RELEASE_APK" --clobber
          else
            gh release create "v0.9.9" "$RELEASE_APK" --target "$GITHUB_SHA" --title "Экзаменатор 0.9.9 — улучшенный тренажёр Android" --notes "Тренажёр демоэкзамена: НМЦК, бюджет и финансовый анализ. Видимая активная ячейка с подписью показателя, автоматическая прокрутка таблицы, сохранение позиции в каждом листе, переход к ошибкам без потери контекста, компактный интерфейс и кнопка «К таблице» в условиях НМЦК. Сохранены коэффициенты устойчивости, ROA/ROE/ROS и бюджет без сальдо. Офлайн-тестовая APK для Android." --latest=false
          fi
