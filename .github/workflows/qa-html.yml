name: Verify standalone HTML on Windows
on:
  push:
    branches: [qa/examtrainer-0914-verify]
permissions:
  contents: read
jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.48.2
      - run: node qa_tests/offline-browser.cjs
      - run: node qa_tests/modes.cjs
      - run: node qa_tests/features.cjs
      - run: node qa_tests/deep.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-check-screens
          path: qa-screens/*.png
          if-no-files-found: ignore
