name: ExamTrainer recovery QA — data safety
on:
  push:
    branches: [qa/recovery-audit-20261109]
    paths:
      - 'app/src/main/assets/sheet-ui.js'
      - 'app/src/main/assets/index.html'
      - 'app/src/main/assets/backup.js'
      - 'desktop/backup-test.cjs'
      - 'desktop/performance-smoke.cjs'
      - 'app/src/main/java/io/github/caprifan2078/examtrainer/MainActivity.java'
      - 'scripts/android-webview-regression.cjs'
      - 'app/src/main/assets/review.js'
      - 'desktop/ui-test.cjs'
      - 'desktop/exam-timer-test.cjs'
      - '.github/workflows/qa-recovery-data-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-regression-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exercises and formulas
        run: |
          node qa_tests/budget-codes.cjs
          node qa_tests/nmck-legal.cjs
          node qa_tests/request0918.cjs
          node qa_tests/full_solve.cjs
          node qa_tests/nmck.cjs
          node qa_tests/statements.cjs
          node qa_tests/independent.cjs
          node qa_tests/review-regression.cjs
          node qa_tests/review-generated.cjs
          node qa_tests/autocomplete.cjs
          for f in app/src/main/assets/*.js; do node --check "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon assembleDebug assembleRelease
      - name: Check unsigned release and owner-signing script
        run: |
          bash -n scripts/sign-release.sh
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "package: name='io.github.caprifan2078.examtrainer.qa0926'"
      - uses: actions/upload-artifact@v4
        with:
          name: ExamTrainer-0.9.26-Recovery-Android-QA
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-emulator-smoke:
    needs: android-regression-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: ExamTrainer-0.9.26-Recovery-Android-QA
          path: app/build/outputs/apk/debug/
      - name: Enable emulator acceleration when available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install and launch the exact QA APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash scripts/android-smoke.sh
            node scripts/android-webview-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExamTrainer-0.9.26-Emulator-Smoke-Screenshot
          path: emulator-home.png
          if-no-files-found: ignore

  windows-storage-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Electron test dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Check Electron editor and autosave failure handling
        working-directory: desktop
        run: |
          node ui-test.cjs
          node exam-timer-test.cjs
          node backup-test.cjs
          node performance-smoke.cjs
      - name: Build Windows portable EXE with the three-hour exam
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win
      - name: Verify portable EXE and embedded offline exam assets
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/dist -Filter '*.exe' | Where-Object { $_.Length -gt 30000000 } | Select-Object -First 1
          if (-not $exe) { throw 'Portable Windows EXE missing or implausibly small' }
          $assets = 'desktop/dist/win-unpacked/resources/assets'
          if (-not (Test-Path "$assets/index.html")) { throw 'Packaged offline index.html missing' }
          if (-not (Select-String -Path "$assets/index.html" -SimpleMatch 'Экзамен — все 3 задания, 3 часа')) { throw '3h exam label absent from packaged HTML' }
          if (-not (Select-String -Path "$assets/sheet-ui.js" -SimpleMatch 'EXAM_DURATION_MS=3*60*60*1000')) { throw '3h shared timer absent from packaged code' }
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: ExamTrainer-0.9.26-ThreeHour-Windows-Portable-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
