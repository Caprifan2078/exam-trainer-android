name: Verify packaged 0.9.24 Windows executable
on:
  push:
    branches: [qa/examtrainer-0914-verify]
permissions:
  contents: read
  actions: read
jobs:
  windows-packaged:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ExamTrainer-0.9.24-Windows-QA
          run-id: 41822157795
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-bin
      - name: Check exact executable and launch window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem qa-bin -Filter '*.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one EXE' }
          $exe = $files[0].FullName
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "EXE SHA256: $hash"
          if ($hash -ne '2e73bb4e4c3d354e7731dd58b107117f710f7a2027e8b7d634bc00e5ebd49778') { throw 'Unexpected EXE bytes' }
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Signature status: $($sig.Status)"
          $started = Start-Process -FilePath $exe -PassThru
          $found = $null
          for ($i=0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            $found = Get-Process | Where-Object { $_.MainWindowTitle -match 'Экзаменатор' } | Select-Object -First 1
            if ($found) { break }
          }
          if (!$found) { throw 'Application window not found within 90 seconds' }
          Write-Host "PASS: packaged executable opened window title $($found.MainWindowTitle), PID $($found.Id)"
          Start-Sleep -Seconds 5
          if (!(Get-Process -Id $found.Id -ErrorAction SilentlyContinue)) { throw 'Application process exited unexpectedly' }
          Write-Host 'PASS: application window process stayed alive for 5 seconds'
