name: Verify delivered ExamTrainer 0.9.18
on:
  push:
    branches: [qa/examtrainer-0914-verify]
permissions:
  contents: read
  actions: read
jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ExamTrainer-0.9.18-Android-QA
          run-id: 41455029745
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-bin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash qa_tests/delivered-android-smoke.sh
